name: nightly
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true  # upstream main may break; the issue below tracks it
    env:
      BASAL_UI_ENGINE_UNCHECKED: "1"
      UV_PYTHON_PREFERENCE: only-managed  # see ci.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv sync --group dev --extra mcp
      - run: uv pip install --reinstall-package basal "basal @ git+https://github.com/rkinas/basal@main"
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync pytest -q --ignore=tests/e2e
      - name: Track the failure in an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="nightly: upstream main breaks basal-ui"
          body="The nightly run against upstream main failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
