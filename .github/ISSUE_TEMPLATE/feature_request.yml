name: Feature request
description: A change to basal-ui's pages or API that the current engine already supports
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What basal-ui should do instead. Mock-ups or screenshots welcome.
    validations:
      required: true
  - type: dropdown
    id: view
    attributes:
      label: Which view
      multiple: true
      options:
        - Overview
        - Models
        - Model manager
        - Playground
        - Batch
        - Inspect
        - API server
        - History
        - Logs
        - Backends
        - HTTP API / MCP
        - Other
    validations:
      required: true
